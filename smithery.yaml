# Local-only MCP stdio configuration. The process talks only to a local Ollama runtime.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      LOCAL_ONLY:
        type: string
        description: "Enforce the local-only policy."
        default: "true"
      OLLAMA_BASE_URL:
        type: string
        description: "Loopback or Compose-local Ollama endpoint."
        default: "http://localhost:11434"
      OLLAMA_CHAT_MODEL:
        type: string
        description: "Installed local chat model."
        default: "qwen3:8b"
      OLLAMA_EMBEDDING_MODEL:
        type: string
        description: "Installed local embedding model."
        default: "qwen3-embedding:0.6b"
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: ['-m', 'job_hunt.mcp_server'],
      env: config
    })
