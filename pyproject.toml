[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopilot-jobhunt"
version = "0.4.4"
description = "AI-powered job scanner, scorer, and application drafter. Finds jobs while you sleep."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["job-search", "ai", "automation", "mcp", "llm", "ollama", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "fastapi>=0.116,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "itsdangerous>=2.2,<3",
    "tzdata>=2026.1,<2027",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9"]
documents = ["python-docx>=1.1,<2", "pypdf>=5,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.8", "build>=1.2", "mcp>=1.9"]

[project.scripts]
autopilot = "job_hunt.main:main"
# Alias matching the PyPI distribution name so MCP-registry runners that derive
# the executable from the package name (e.g. `uvx autopilot-jobhunt mcp`, per
# server.json packageArguments) resolve to a real command.
autopilot-jobhunt = "job_hunt.main:main"

[project.urls]
Homepage = "https://github.com/tarunlnmiit/autopilot-jobhunt"
Repository = "https://github.com/tarunlnmiit/autopilot-jobhunt"
Issues = "https://github.com/tarunlnmiit/autopilot-jobhunt/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["job_hunt"]
include = ["job_hunt/data/**", "job_hunt/prompts/**", "job_hunt/web/templates/**", "job_hunt/web/static/**"]
exclude = [
    "job_hunt/data/candidate_profile.json",
    "job_hunt/data/master_resume.json",
    "job_hunt/data/master_resume.en.json",
    "job_hunt/data/search_preferences.json",
    "job_hunt/data/salary_benchmarks.json",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "job_hunt/_migrations/alembic.ini"
"migrations" = "job_hunt/_migrations"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["job_hunt"]

[tool.coverage.run]
source = ["job_hunt"]

[tool.coverage.report]
# The mocked suite must not silently regress. Gate sits below the current ~90%.
fail_under = 85
