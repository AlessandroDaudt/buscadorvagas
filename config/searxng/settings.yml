use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - wikidata

general:
  instance_name: Autopilot Local Research

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "autopilot-local-research-network"
  limiter: false
  image_proxy: false
