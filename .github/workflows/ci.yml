name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -c constraints.lock -e ".[dev,documents]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check job_hunt tests conftest.py
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=job_hunt --cov-report=term-missing --cov-report=xml
      - name: Verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  dependency-and-code-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.lock -e ".[documents]" pip-audit bandit
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: Python security checks
        # Fail on medium/high findings. Low subprocess notices are reviewed:
        # commands use fixed executables/argument arrays, shell=False and timeouts.
        run: python -m bandit -q -ll -r job_hunt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build local image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: autopilot-jobhunt:ci
